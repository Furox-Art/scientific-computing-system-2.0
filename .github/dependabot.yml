version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # Dev-only cap documented in pyproject.toml (numpy 2.5 stubs vs mypy 3.10 target)
      - dependency-name: "numpy"
