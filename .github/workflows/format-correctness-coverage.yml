name: Patch remaining correctness coverage

on:
  push:
    branches:
      - hardening/full-correctness-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/full-correctness-audit
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply focused coverage fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/test_correctness_coverage.py')
          text = test_path.read_text(encoding='utf-8')

          old = '''    with pytest.raises(ValueError, match="point estimate"):\n        stats.bootstrap_ci([1.0, 2.0], lambda sample, **kwargs: np.nan, n_resamples=2)\n'''
          new = '''    def point_nan_stat(sample, axis=None):  # type: ignore[no-untyped-def]\n        if axis is None:\n            return float("nan")\n        return np.mean(sample, axis=axis)\n\n    with pytest.raises(ValueError, match="point estimate"):\n        stats.bootstrap_ci([1.0, 2.0], point_nan_stat, n_resamples=2)\n'''
          if old not in text:
              raise SystemExit('point-estimate test marker not found')
          text = text.replace(old, new, 1)

          marker = '''\n\n# ---------------------------------------------------------------------------\n# ML utility/model validation branches\n# ---------------------------------------------------------------------------\n'''
          additions = '''\n\ndef test_guided_remaining_defensive_branches(\n    monkeypatch: pytest.MonkeyPatch, tmp_path: Path\n) -> None:\n    interpolated = gf.FitDataset(\n        "interpolated",\n        np.arange(5.0),\n        np.array([1.0, 2.0, np.nan, 4.0, 5.0]),\n    )\n\n    def nonfinite_interp(x, xp, fp):  # type: ignore[no-untyped-def]\n        return np.full(np.asarray(x).shape, np.inf, dtype=float)\n\n    monkeypatch.setattr(gf.np, "interp", nonfinite_interp)\n    with pytest.raises(ValueError, match="prepared x and y must be finite"):\n        gf._prepare(interpolated, "interpolate")\n    monkeypatch.undo()\n\n    small = gf.FitDataset("small-keep", np.arange(1.0, 6.0), 2.0 * np.arange(1.0, 6.0) + 1.0)\n    monkeypatch.setattr(gf, "_outliers", lambda residuals: np.array([0, 1], dtype=np.intp))\n    kept = gf.run_guided_fit((small,), "linear", outlier_policy="keep")\n    assert kept.datasets[0].n_used == 5\n    monkeypatch.undo()\n\n    dataset = _linear_dataset()\n    result = gf.run_guided_fit((dataset,), "linear")\n    manifest = gf.manifest_dict(result, (dataset,), x_column="x", y_column="y")\n    assert manifest["result"]["rerun_data_hashes"] == result.data_hashes\n\n    saved_manifest, _source = _save_manifest_for_mutation(tmp_path)\n    payload = json.loads(saved_manifest.read_text(encoding="utf-8"))\n    payload["inputs"][0]["dataset_key"] = "saved-alias"\n    runtime_fallback = tmp_path / "runtime-fallback.json"\n    runtime_fallback.write_text(json.dumps(payload), encoding="utf-8")\n    assert gf.rerun_manifest(runtime_fallback).stability_warning is False\n'''
          if 'def test_guided_remaining_defensive_branches(' not in text:
              if marker not in text:
                  raise SystemExit('guided insertion marker not found')
              text = text.replace(marker, additions + marker, 1)

          epi_tail = '''    with pytest.raises(RuntimeError, match="did not converge"):\n        epi.final_size_iteration(2.0)\n'''
          epi_new = '''    with pytest.raises(RuntimeError, match="did not converge"):\n        epi.final_size_iteration(2.0)\n    with pytest.raises(ValueError, match="tol"):\n        epi.final_size_iteration(2.0, tol=0.0)\n    with pytest.raises(ValueError, match="max_iter"):\n        epi.final_size_iteration(2.0, max_iter=0)\n'''
          if epi_tail not in text:
              raise SystemExit('epidemiology insertion marker not found')
          text = text.replace(epi_tail, epi_new, 1)
          test_path.write_text(text, encoding='utf-8')

          source_path = Path('src/cds2/guided_fit.py')
          source = source_path.read_text(encoding='utf-8')
          dead = '''    for runtime_key, saved_key, dataset in zip(runtime_keys, saved_keys, datasets, strict=True):\n        digest = rerun.data_hashes[runtime_key]\n        previous_digest = previous_hashes.get(saved_key)\n        if previous_digest is None:\n            previous_digest = previous_hashes.get(runtime_key)\n        if previous_digest is None and len({value.name for value in datasets}) == len(datasets):\n            previous_digest = previous_hashes.get(dataset.name)\n        if previous_digest != digest:\n            details.append(f"input data changed: {saved_key}")\n'''
          simplified = '''    for runtime_key, saved_key in zip(runtime_keys, saved_keys, strict=True):\n        digest = rerun.data_hashes[runtime_key]\n        previous_digest = previous_hashes.get(saved_key)\n        if previous_digest is None:\n            previous_digest = previous_hashes.get(runtime_key)\n        if previous_digest != digest:\n            details.append(f"input data changed: {saved_key}")\n'''
          if dead not in source:
              raise SystemExit('rerun hash fallback marker not found')
          source_path.write_text(source.replace(dead, simplified, 1), encoding='utf-8')
          PY
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate focused patch
        run: |
          pip install -e .[dev]
          ruff check src/cds2/guided_fit.py tests/test_correctness_coverage.py --fix
          ruff format src/cds2/guided_fit.py tests/test_correctness_coverage.py
          ruff check src/cds2/guided_fit.py tests/test_correctness_coverage.py
          pytest -q tests/test_correctness_coverage.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cds2/guided_fit.py tests/test_correctness_coverage.py
          git commit -m 'Cover remaining correctness guards'
          git push origin HEAD:hardening/full-correctness-audit
