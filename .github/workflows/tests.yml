name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Every job here pip-installs and executes third-party
# packages, so none of them should hold a write-scoped GITHUB_TOKEN even if the
# repository default is ever flipped from read-only. Kept at `contents: read`
# so release.yml can still call this workflow, which requires the callee's
# permissions to be a subset of the caller's.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: Type check (strict)
        run: mypy

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: Blended coverage gate (100%)
        run: pytest --cov=cds2 --cov-report=term-missing --cov-fail-under=100

  package:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build validation tooling
        run: python -m pip install --upgrade build twine
      - name: Build sdist and pure-Python wheel
        env:
          CDS_PURE: "1"
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Smoke-install built wheel
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --upgrade pip
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -c "import importlib.metadata as metadata, cds2; assert cds2.__version__ == metadata.version('scientific-computing-system-2.0')"
      - name: Smoke-test installed CLI and guided fit
        run: |
          .wheel-smoke/bin/cds2 info
          .wheel-smoke/bin/python - <<'PY'
          import csv
          with open("cli-smoke.csv", "w", newline="", encoding="utf-8") as handle:
              writer = csv.writer(handle)
              writer.writerow(["x", "y", "sigma"])
              for x in range(1, 21):
                  writer.writerow([x, 2.0 * x + 1.0, 0.2])
          PY
          .wheel-smoke/bin/cds2 guided-fit cli-smoke.csv --x x --y y --sigma sigma --model linear --missing interpolate --outliers keep --report none --output-dir cli-smoke-output
          test -f cli-smoke-output/guided_fit_manifest.json
          test -f cli-smoke-output/cli-smoke_fit.png
          test -f cli-smoke-output/cli-smoke_fit.pdf
          test -f cli-smoke-output/cli-smoke_residuals.png
          test -f cli-smoke-output/cli-smoke_residuals.pdf
          .wheel-smoke/bin/cds2 guided-fit-rerun cli-smoke-output/guided_fit_manifest.json

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest --cov=cds2 --cov-report=term-missing

  # Property-based tests (hypothesis) run separately with a higher example count.
  property-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package with test extras
        run: pip install -e .[test]
      - name: Run property-based tests
        run: python -m pytest tests/property/ -v --hypothesis-seed=0

  # Regression gate: after benchmarks run, assert no benchmark regressed.
  regression:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Run benchmarks
        run: python benchmarks/run_benchmarks.py --quick
      - name: Regression gate
        run: python -m cds2.bench.regression --tolerance 0.10
