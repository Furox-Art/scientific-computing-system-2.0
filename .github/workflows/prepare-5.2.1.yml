name: Prepare 5.2.1 metadata

on:
  push:
    branches: [release/5.2.1-integrity]
    paths:
      - ".github/workflows/prepare-5.2.1.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/5.2.1-integrity

      - name: Prepare version and changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version = "5.2.1"

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          if 'version = "5.2.0"' in text:
              text = text.replace('version = "5.2.0"', f'version = "{version}"', 1)
          elif f'version = "{version}"' not in text:
              raise SystemExit("unexpected pyproject.toml version")
          pyproject.write_text(text, encoding="utf-8")

          version_file = Path("src/cds2/_version.py")
          text = version_file.read_text(encoding="utf-8")
          if '__version__ = "5.2.0"' in text:
              text = text.replace('__version__ = "5.2.0"', f'__version__ = "{version}"', 1)
          elif f'__version__ = "{version}"' not in text:
              raise SystemExit("unexpected src/cds2/_version.py version")
          version_file.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          current = changelog.read_text(encoding="utf-8")
          heading = "## [v5.2.1] - 2026-09-05"
          if not current.startswith(heading):
              entry = """## [v5.2.1] - 2026-09-05

Release-integrity patch: the cross-platform installed-wheel CLI validation merged after v5.2.0 is now part of a distinct release commit, and the release pipeline is fail-closed against tag/PyPI drift.

### Changed

- Installed-wheel CLI smoke validation is retained on Ubuntu, Windows and macOS for `cds2 info`, `guided-fit`, fit/residual artifacts and `guided-fit-rerun`.
- Release preflight now requires `main`, enforces lockstep package/changelog metadata, and refuses an existing PyPI version or Git tag instead of silently reusing it.
- After publication, the exact public PyPI version is clean-installed and CLI-smoke-tested on Ubuntu, Windows and macOS before the GitHub Release is created.
- GitHub Release creation now verifies that the resulting tag resolves to the exact workflow commit.

### Fixed

- Prevented a release-integrity failure mode where an already-published PyPI version could be skipped while a GitHub release/tag was created from newer repository code.

"""
              changelog.write_text(entry + current, encoding="utf-8")
          PY

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/cds2/_version.py CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Release metadata already prepared."
            exit 0
          fi
          git commit -m "Prepare release 5.2.1"
          git push origin HEAD:release/5.2.1-integrity
