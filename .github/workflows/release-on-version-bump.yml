name: Release on version bump

on:
  push:
    branches: [main]
    paths:
      - "src/cds2/_version.py"

# This workflow only starts the fail-closed release workflow. The release
# workflow itself performs all metadata, PyPI, package and tag verification.
permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main --repo "$GITHUB_REPOSITORY"
