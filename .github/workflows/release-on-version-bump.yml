name: Release on version bump

on:
  push:
    branches: [main]
    paths:
      - "src/cds2/_version.py"

# This workflow only starts the fail-closed release workflows. release.yml
# performs all metadata, PyPI, package and tag verification for Python, and
# npm-publish.yml performs the equivalent for the npm registry.
#
# One version bump fans out to both registries. npm publishing deliberately
# stays in its own workflow rather than becoming a job inside release.yml,
# because:
#   * release.yml's publish job runs under the `pypi` environment with its own
#     approval gate; folding npm in would make npm wait on, or share, PyPI's
#     OIDC identity and approval;
#   * a failed or slow npm publish must not mark a completed PyPI release run
#     as failed, and the two registries have independent retry paths;
#   * each workflow keeps its own concurrency group, so a duplicate dispatch
#     cannot race an in-flight publish on the other registry.
# Both workflows re-verify version lockstep independently, so running them in
# parallel is safe.
permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch release workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main --repo "$GITHUB_REPOSITORY"

      - name: Dispatch npm publish workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        # npmjs trusted publishing is not configured for this package yet.
        # The repository NPM_TOKEN path is known-good, so automatic version
        # bumps explicitly select it instead of first failing the OIDC path.
        run: >-
          gh workflow run npm-publish.yml
          --ref main
          --repo "$GITHUB_REPOSITORY"
          -f use_token_fallback=true