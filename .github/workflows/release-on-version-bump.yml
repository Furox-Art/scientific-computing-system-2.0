name: Release on version bump

on:
  push:
    branches: [main]
    paths:
      - "src/cds2/_version.py"

# The single automatic entry point. A version bump dispatches release.yml,
# which owns the PyPI publish, the tag and the GitHub Release. npm-publish.yml
# runs only after that workflow completes successfully (`workflow_run`), so the
# npm launcher can never publish a version that PyPI does not serve.
#
# npm stays a separate workflow rather than a job inside release.yml:
#   * release.yml's publish job runs under the `pypi` environment with its own
#     approval gate; npm keeps its own `npm` environment and OIDC identity;
#   * a failed or slow npm publish must not mark a completed PyPI release run
#     as failed, and the two registries have independent retry paths;
#   * each workflow keeps its own concurrency group, so a duplicate run cannot
#     race an in-flight publish on the other registry.
# Both workflows re-verify version lockstep independently.
permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch release workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main --repo "$GITHUB_REPOSITORY"
