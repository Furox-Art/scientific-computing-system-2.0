name: Apply PDF report pagination

on:
  push:
    branches:
      - feature/pdf-report-pagination
    paths:
      - .github/workflows/apply-pdf-report-pagination.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/pdf-report-pagination
      - name: Apply scoped source, test, and docs changes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_pdf_pagination.py
          python /tmp/apply_pdf_pagination.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cds2/guided_fit.py tests/test_guided_fit.py docs/api/guided_fit.md
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'Paginate long guided-fit PDF reports'
          git push origin HEAD:feature/pdf-report-pagination
