name: npm Publish

# Two entry paths, and deliberately no `push` path trigger:
#   * workflow_run after a successful `Release` run is the automatic path. The
#     npm launcher may only be published for a version PyPI already serves.
#   * workflow_dispatch remains available for manual recovery or for testing
#     the preferred OIDC path after an npmjs trusted publisher is configured.
# A `push` path trigger was dropped on purpose: a version bump normally touches
# package.json too, which would fire both this trigger and the automatic path,
# running the same publish twice.
#
# npmjs trusted publishing is not configured for this package yet, so the
# automatic path explicitly selects the verified NPM_TOKEN credential. Manual
# dispatches default to the preferred OIDC path.
on:
  workflow_dispatch:
    inputs:
      use_token_fallback:
        description: >-
          Publish with the long-lived NPM_TOKEN secret instead of OIDC trusted
          publishing. Only use this while no npmjs.com trusted publisher is
          configured. The token path cannot mint a Sigstore attestation, so
          --provenance is never passed on that path.
        type: boolean
        required: false
        default: false
  workflow_run:
    workflows: ["Release"]
    types: [completed]

# Serialise npm publishes and never cancel one: two concurrent publishes of the
# same version would race each other on the registry.
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A completed Release run also fires on failure and on manual dispatch. The
  # publish job below may only proceed when the release actually published to
  # PyPI; otherwise npm would serve a version that Python users cannot install.
  release_gate:
    name: Require a successful PyPI release
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      released: ${{ steps.check.outputs.released }}
      head_sha: ${{ steps.check.outputs.head_sha }}
    steps:
      - name: Check the triggering Release run published
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # The trigger is the Release workflow. In this repository Release is
          # dispatched by release-on-version-bump, so the triggering run's
          # event is `workflow_dispatch`; a future workflow_run trigger stays
          # accepted. Release already verified its upstream CI run, so trust
          # the head SHA only after proving the run belongs to this
          # repository's release.yml on the default branch.
          data="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            --jq '[.head_sha, .event, .head_branch, .conclusion, .repository.full_name, .path] | @tsv')"
          IFS=$'\t' read -r sha event branch conclusion repo path <<<"${data}"
          echo "head_sha=${sha}" >> "$GITHUB_OUTPUT"
          case "${event}" in
            workflow_run|workflow_dispatch) ;;
            *)
              echo "::error::Run ${RUN_ID} has unsupported event ${event}."
              exit 1
              ;;
          esac
          if [ "${path}" != ".github/workflows/release.yml" ] || \
             [ "${branch}" != "main" ] || \
             [ "${repo}" != "${GITHUB_REPOSITORY}" ]; then
            echo "::error::Run ${RUN_ID} is not a Release run on ${GITHUB_REPOSITORY} main."
            exit 1
          fi
          # A Release run whose jobs all skip (the version is already released)
          # concludes `skipped`. That is an ordinary push, not a release, so the
          # npm job must skip too. A failed or cancelled release stays loud.
          case "${conclusion}" in
            success|skipped) ;;
            *)
              echo "::error::Release run ${RUN_ID} concluded ${conclusion}."
              exit 1
              ;;
          esac
          if [ "${conclusion}" != "success" ]; then
            echo "Release run was ${conclusion}; no release was published."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          publish_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "publish") | .conclusion] | first // "missing"')"
          echo "Release publish job: ${publish_conclusion}"
          if [ "${publish_conclusion}" = "success" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: release_gate
    if: |
      always() &&
      (github.event_name != 'workflow_run' || needs.release_gate.outputs.released == 'true')
    runs-on: ubuntu-latest
    # Manual-approval gate for publication, mirroring the `pypi` environment.
    # This is also the environment name to configure on npmjs.com.
    environment: npm
    permissions:
      contents: read
      # Required for the preferred OIDC trusted-publishing path. GitHub cannot
      # scope id-token per step, so it is also granted on the token path; npm
      # simply does not use it there because no OIDC publisher is configured.
      # Drop this permission once trusted publishing is set up and only the
      # token fallback is ever used.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Publish the exact commit the Release workflow published, not
          # whatever main points at when this follow-up run starts.
          ref: ${{ github.event_name == 'workflow_run' && needs.release_gate.outputs.head_sha || github.ref }}
          # The content guard below walks back to the commit that introduced
          # the version being published; a depth-1 clone has no such history.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # npm trusted publishing requires Node >= 22.14.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Never cache in a release build.
          package-manager-cache: false

      - name: Ensure a modern npm CLI
        run: npm install -g npm@^11.5.1

      - name: Report publish toolchain
        run: |
          node --version
          npm --version

      # Decide which credential path to use, and fail closed if the requested
      # path has no credential. Trusted publishing stays the default and the
      # preferred path; the token path is an explicit, opt-in exception.
      - name: Resolve publish mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          USE_TOKEN_FALLBACK: ${{ inputs.use_token_fallback }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "workflow_dispatch" ]; then
            # Automatic path: no npm trusted publisher is registered for this
            # package yet (5.4.4 carries no attestation), so use NPM_TOKEN.
            REQUESTED=true
          else
            REQUESTED="$(printf '%s' "${USE_TOKEN_FALLBACK}" | tr '[:upper:]' '[:lower:]')"
          fi
          case "$REQUESTED" in
            true)
              if [ -z "${NPM_TOKEN}" ]; then
                echo "ERROR: use_token_fallback=true was requested but the NPM_TOKEN secret is empty." >&2
                echo "Add a granular access token as the NPM_TOKEN secret, or leave" >&2
                echo "use_token_fallback unset to publish with OIDC trusted publishing." >&2
                exit 1
              fi
              MODE=token
              echo "Publish mode: token (long-lived NPM_TOKEN)."
              echo "No Sigstore provenance attestation can be produced on this path."
              ;;
            false|"")
              MODE=oidc
              echo "Publish mode: oidc (trusted publishing, --provenance)."
              ;;
            *)
              echo "ERROR: use_token_fallback must be a boolean, got '${USE_TOKEN_FALLBACK}'" >&2
              exit 1
              ;;
          esac
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"

      # The npm >= 11.5.1 floor is an OIDC trusted-publishing requirement, so it
      # is asserted only on the OIDC path. Numeric comparison, never a regex:
      # a pattern such as ^11\.(5[1-9]|[6-9][0-9])\. would wrongly reject
      # npm 11.19.0 (the version bundled with Node 24) because [6-9][0-9] only
      # covers 11.60-11.99.
      - name: Fail closed when npm is too old for OIDC trusted publishing
        if: steps.mode.outputs.mode == 'oidc'
        run: |
          node -e "
            const { execFileSync } = require('child_process');
            const npmVersion = execFileSync('npm --version', { encoding: 'utf8', shell: true }).trim();
            const [major, minor] = npmVersion.split('.').map(Number);
            const supportsOidc = major > 11 || (major === 11 && minor >= 5);
            if (!supportsOidc) {
              console.error(
                'npm ' + npmVersion + ' is too old for OIDC trusted publishing (need >= 11.5.1)',
              );
              process.exit(1);
            }
            console.log('npm ' + npmVersion + ' supports OIDC trusted publishing');
          "

      # Gates kept from the hardening work: both JS entry points must parse and
      # the package's own contract test must pass before anything is published.
      - name: Validate JS entry points and run npm test
        run: |
          node --check index.js
          node --check bin/scs2.js
          npm test

      # Tarball content allowlist: `files` in package.json is the single source
      # of truth, and this asserts the packed tarball contains exactly it. The
      # npm registry is immutable, so a wrongly scoped 5.2.5 could not be
      # replaced without a version bump.
      - name: Verify packed tarball contents
        run: |
          node -e "
            const { execFileSync } = require('child_process');
            const packed = JSON.parse(
              execFileSync('npm pack --dry-run --json', { encoding: 'utf8', shell: true }),
            )[0];
            const actual = packed.files.map((f) => f.path).sort();
            const expected = ['LICENSE', 'README.md', 'bin/scs2.js', 'index.js', 'package.json'];
            const missing = expected.filter((f) => !actual.includes(f));
            const unexpected = actual.filter((f) => !expected.includes(f));
            console.log('tarball files:', actual.join(', '));
            if (missing.length || unexpected.length) {
              console.error('missing:', missing, 'unexpected:', unexpected);
              process.exit(1);
            }
            console.log('tarball contents match the files allowlist');
          "

      # Version lockstep: package.json must track the Python release version, so
      # the two registries can never drift apart.
      - name: Verify version lockstep across package.json, _version.py and pyproject.toml
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const versionModule = fs.readFileSync('src/cds2/_version.py', 'utf8');
            const versionMatch = versionModule.match(/^__version__\s*=\s*\"([^\"]+)\"/m);
            if (!versionMatch) {
              throw new Error('could not read __version__ from src/cds2/_version.py');
            }
            const pyproject = fs.readFileSync('pyproject.toml', 'utf8').match(/^version\s*=\s*\"([^\"]+)\"/m);
            if (!pyproject) {
              throw new Error('could not read version from pyproject.toml');
            }
            const npmVersion = pkg.version;
            if (npmVersion !== versionMatch[1] || npmVersion !== pyproject[1]) {
              throw new Error(
                'version mismatch: package.json=' + npmVersion +
                ' _version.py=' + versionMatch[1] +
                ' pyproject.toml=' + pyproject[1],
              );
            }
            console.log('version lockstep ok: ' + npmVersion);
          "

      # Registry version existence check. npm versions are immutable, so an
      # already-present version must not be re-published; this keeps manual
      # re-dispatches idempotent instead of failing with a registry error.
      - name: Check whether this version already exists on npm
        id: exists
        shell: bash
        env:
          PACKAGE: scientific-computing-system-2.0
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE}@${VERSION}" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE}@${VERSION} is already on the npm registry"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE}@${VERSION} is new on the npm registry"
          fi

      # The existence gate above skipped versions that are already on npm. When
      # the version is new, the upload must be exactly the content the version
      # bump released: npm 5.4.5 was packed from 9a0d609 (a later commit) rather
      # than its tag 012979f, so its README advertised 1,883 tests and a PyPI
      # attestation while the tag declares 1,882 and no provenance. npm versions
      # are immutable, so the check runs before any upload: every packed file
      # must match the commit that introduced this version. The automatic path
      # checks out the Release run's head SHA, which can also carry post-bump
      # commits, so the guard applies there too.
      - name: Refuse to publish content newer than the version bump
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          export VERSION
          python3 - <<'PY'
          import json
          import os
          import subprocess

          version = os.environ["VERSION"]

          def run(*args):
              return subprocess.run(args, capture_output=True)

          def version_at(rev):
              raw = run("git", "show", f"{rev}:package.json")
              if raw.returncode != 0:
                  return None
              try:
                  return json.loads(raw.stdout.decode("utf-8"))["version"]
              except (UnicodeDecodeError, ValueError, KeyError, TypeError):
                  return None

          head = run("git", "rev-parse", "HEAD").stdout.decode().strip()
          if version_at(head) != version:
              raise SystemExit(f"HEAD does not declare package.json version {version}")

          release = None
          for rev in run("git", "rev-list", "--first-parent", "HEAD").stdout.decode().split():
              if version_at(rev) != version:
                  break
              release = rev
          if release is None:
              raise SystemExit(f"cannot find the commit that introduced version {version}")
          if release == head:
              print(f"PASS: publishing {version} from its own version-bump commit {head[:9]}")
              raise SystemExit(0)

          packed = json.loads(
              run("npm", "pack", "--dry-run", "--json").stdout.decode("utf-8")
          )[0]["files"]
          differing = []
          for item in packed:
              path = item["path"]
              expected = run("git", "show", f"{release}:{path}")
              actual = run("git", "show", f"HEAD:{path}")
              if (
                  expected.returncode != 0
                  or actual.returncode != 0
                  or expected.stdout != actual.stdout
              ):
                  differing.append(path)
          if differing:
              raise SystemExit(
                  f"refusing to publish {version} from {head[:9]}: packed files differ from "
                  f"the version-bump commit {release[:9]} ({', '.join(differing)}). "
                  f"Bump the version and release the new content instead."
              )
          print(f"PASS: packed content matches the version-bump commit {release[:9]}")
          PY

      # Preferred path: OIDC trusted publishing, with provenance.
      - name: Publish to npm (OIDC trusted publishing)
        if: steps.mode.outputs.mode == 'oidc' && steps.exists.outputs.exists == 'false'
        run: npm publish --access public --provenance

      # Explicit opt-in path: long-lived NPM_TOKEN. A classic automation token
      # cannot mint a Sigstore attestation, so --provenance is deliberately NOT
      # passed here and no provenance is claimed.
      - name: Publish to npm (long-lived NPM_TOKEN)
        if: steps.mode.outputs.mode == 'token' && steps.exists.outputs.exists == 'false'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      # Fail closed on publication, but tolerate registry propagation.
      #
      # `npm publish` returns when the registry's WRITE path accepts the upload.
      # The READ path is served by a CDN that propagates asynchronously: ~95s
      # was observed for a sibling repository, and the packument is served with
      # `Cache-Control: public, max-age=300`, so any client-side cache can
      # replay a stale document for up to five minutes. The previous inline loop
      # retried 6 times with a flat 10s sleep: a ~60s budget, shorter than both
      # the propagation window and the cache TTL. Run 37120536500 therefore
      # failed a 5.2.5 publish that had genuinely succeeded.
      #
      # The poll lives in scripts/wait-for-npm-visibility.mjs so it can be unit
      # tested in both directions (404-then-success must pass; never-appearing
      # must still fail). It reads the registry directly rather than calling
      # `npm view`, because `npm view` resolves through npm's on-disk HTTP cache
      # and cannot distinguish "not propagated yet" from a registry error.
      # First match wins; on budget exhaustion it emits ::warning:: and then
      # exits non-zero, so a never-published version still fails closed.
      - name: Verify npm publication
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        env:
          PACKAGE: scientific-computing-system-2.0
          PUBLISH_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          # 12 attempts with a 5s base and a 45s cap is a ~7.5 minute budget:
          # wider than the 95s propagation window and the 300s cache TTL.
          node scripts/wait-for-npm-visibility.mjs "${PACKAGE}" "${VERSION}" 12
          if [ "${PUBLISH_MODE}" = "oidc" ]; then
            echo "Publish mode was oidc; an attestation is expected on the version document."
          else
            echo "Publish mode was token: a long-lived automation token cannot mint a" >&2
            echo "Sigstore attestation, so this version carries no provenance." >&2
          fi

      - name: Confirm already-published version is intact
        if: steps.exists.outputs.exists == 'true'
        shell: bash
        env:
          PACKAGE: scientific-computing-system-2.0
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "${PACKAGE}@${VERSION} was already published; nothing to do."
          npm view "${PACKAGE}@${VERSION}" version