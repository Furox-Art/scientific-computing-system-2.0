name: Apply guided-fit fixes

on:
  push:
    branches: [feature/guided-scientific-fitting]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/guided-scientific-fitting
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply strict typing fixes
        run: python tools/fix_guided_types.py
      - name: Format with repository Ruff
        run: |
          pip install ruff
          ruff format .
          ruff check .
      - name: Verify strict typing
        run: |
          pip install -e .[dev]
          mypy
      - name: Commit generated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix guided fit formatting and strict typing"
            git push origin HEAD:feature/guided-scientific-fitting
          fi
