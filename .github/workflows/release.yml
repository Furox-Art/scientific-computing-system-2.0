name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build_sdist_and_pure_wheel:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build
      - name: Build sdist and pure-Python fallback wheel
        env:
          CDS_PURE: "1"
        run: |
          python -m build --sdist
          python -m build --wheel
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdist-and-pure-wheel
          path: dist/*

  build_wheels:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["310", "311", "312", "313"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build compiled wheel
        uses: pypa/cibuildwheel@v4.2
        env:
          CIBW_BUILD: "cp${{ matrix.python }}-*"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl

  publish:
    needs: [build_sdist_and_pure_wheel, build_wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Skip when the version is already on PyPI
        id: gate
        run: |
          VERSION=$(python -c "
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(data['project']['version'])
          ")
          NAME=$(python -c "
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(data['project']['name'])
          ")
          if curl -sfL "https://pypi.org/pypi/${NAME}/${VERSION}/json" > /dev/null; then
            echo "Version ${VERSION} of ${NAME} already published - skipping upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download all distributions
        if: steps.gate.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        if: steps.gate.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
