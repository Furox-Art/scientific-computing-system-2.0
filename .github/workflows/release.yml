name: Release

on:
  workflow_dispatch:

# Serialise releases globally and never cancel one. Two releases started close
# together would otherwise race each other into the same PyPI project.
concurrency:
  group: release
  cancel-in-progress: false

# This workflow publishes the Python distribution to PyPI only. The npm package
# is published by npm-publish.yml, which release-on-version-bump.yml dispatches
# alongside this workflow so one version bump updates both registries. npm keeps
# its own workflow so a failed npm publish cannot fail a completed PyPI release.

permissions:
  contents: read

jobs:
  # Run an independent release preflight instead of calling tests.yml as a
  # reusable workflow. Keeping release validation self-contained avoids
  # cancellation/coordination issues with normal CI.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require release from main
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ERROR: releases must be dispatched from main; got $GITHUB_REF"
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify release metadata consistency
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import tomllib

          root = pathlib.Path(".")
          project = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          version = project["project"]["version"]

          version_text = (root / "src/cds2/_version.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', version_text, re.MULTILINE)
          if match is None or match.group(1) != version:
              raise SystemExit("ERROR: pyproject.toml and src/cds2/_version.py are out of sync")

          changelog = (root / "CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.search(r"^## \[v([^\]]+)\]", changelog, re.MULTILINE)
          if heading is None or heading.group(1) != version:
              raise SystemExit("ERROR: CHANGELOG.md does not start with the package version")

          package_json = json.loads((root / "package.json").read_text(encoding="utf-8"))
          if package_json.get("version") != version:
              raise SystemExit("ERROR: package.json is out of sync with pyproject.toml")

          citation = (root / "CITATION.cff").read_text(encoding="utf-8")
          citation_match = re.search(r'^version:\s*"([^"]+)"', citation, re.MULTILINE)
          if citation_match is None or citation_match.group(1) != version:
              raise SystemExit("ERROR: CITATION.cff is out of sync with pyproject.toml")

          print(f"Release metadata is consistent for {project['project']['name']} {version}")
          PY

      - name: Inspect existing PyPI version and tag for safe recovery
        shell: bash
        run: |
          set -euo pipefail
          readarray -t META < <(python - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["name"])
          print(data["project"]["version"])
          PY
          )
          PACKAGE="${META[0]}"
          VERSION="${META[1]}"

          # An existing version is not fatal: it may be a release whose PyPI
          # upload succeeded before the tag or GitHub Release step failed. The
          # publish job compares the downloaded artifacts against PyPI
          # byte-for-byte and skips the upload only on an exact match.
          if curl -sfL "https://pypi.org/pypi/${PACKAGE}/${VERSION}/json" > /dev/null; then
            echo "::notice::${PACKAGE} ${VERSION} already exists on PyPI; entering recovery mode."
            echo "::notice::The publish job will verify its artifacts match PyPI before skipping the upload."
          else
            echo "${PACKAGE} ${VERSION} is unpublished; this is a normal release."
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "::notice::tag v${VERSION} already exists; the release step will verify its commit."
          fi

      - name: Install package and release test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci-tools.txt -e ".[dev,test]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Coverage gate
        run: pytest --cov=cds2 --cov-report=term-missing --cov-fail-under=100
      - name: Property tests
        run: python -m pytest tests/property/ -v --hypothesis-seed=0

      # The regression gate is only meaningful with a persisted baseline. The
      # history directory is not committed, so without this cache every release
      # appended a single run and compared it against nothing ("no prior
      # baseline [PASS]"). Restore the most recent release history, then save
      # this run under a unique key on success.
      - name: Restore benchmark history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmarks/history
          key: bench-history-${{ github.run_id }}
          restore-keys: |
            bench-history-

      - name: Benchmark regression gate
        run: |
          python benchmarks/run_benchmarks.py --quick
          python - <<'PY'
          from benchmarks.run_benchmarks import run_all
          from cds2.prof import BenchHistory
          from cds2.prof.history import BenchEntry

          results = run_all(quick=True)
          entries = [
              BenchEntry(
                  name=r.name,
                  baseline_library=r.baseline_library,
                  baseline_seconds=r.baseline_seconds,
                  cds2_seconds=r.cds2_seconds,
              )
              for r in results
          ]
          path = BenchHistory().append(entries)
          print(f"Recorded {len(entries)} benchmark results to {path}")
          PY
          python -m cds2.bench.regression --tolerance 0.10
          python - <<'PY'
          from cds2.prof import BenchHistory

          frame = BenchHistory().load_range()
          if frame.empty:
              raise SystemExit(
                  "ERROR: benchmark history is empty; "
                  "the regression gate must not pass on zero rows"
              )
          runs = frame["timestamp"].nunique()
          if runs < 2:
              print(
                  "::warning::benchmark history holds only the current run; "
                  "this release establishes the baseline and has nothing to compare against."
              )
          print(
              f"Benchmark history holds {len(frame)} rows "
              f"across {frame['name'].nunique()} benchmarks in {runs} run(s)"
          )
          PY

      - name: Save benchmark history
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmarks/history
          key: bench-history-${{ github.run_id }}

  build_sdist_and_pure_wheel:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build
      - name: Pin build timestamp for reproducibility
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build sdist and pure-Python fallback wheel
        env:
          CDS_PURE: "1"
        run: |
          python -m build --sdist
          python -m build --wheel
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sdist-and-pure-wheel
          path: dist/*

  build_wheels:
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["310", "311", "312", "313"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pin build timestamp for reproducibility
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build compiled wheel
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2
        env:
          CIBW_BUILD: "cp${{ matrix.python }}-*"
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl

  publish:
    needs: [build_sdist_and_pure_wheel, build_wheels]
    runs-on: ubuntu-latest
    # The `pypi` environment gates publication (manual approval) and matches
    # the PyPI trusted-publisher configuration documented in docs/release.md.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    outputs:
      package_name: ${{ steps.meta.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          print(f"name={data['project']['name']}")
          print(f"version={data['project']['version']}")
          PY

      # Re-check immediately before upload to close the race between preflight
      # and publication. Existing versions are fatal: silently skipping them can
      # make a GitHub tag point at code that is not the code on PyPI.
      - name: Detect API token fallback availability
        id: auth
        shell: bash
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      # Recovery must never substitute different bytes for a published
      # version. When PyPI already serves this version, require the freshly
      # built wheel + sdist to match its files by name, size and sha256; only
      # then skip the upload and continue to the tag/GitHub Release steps.
      - name: Inspect existing PyPI release for safe recovery
        id: pypi_state
        shell: bash
        env:
          PACKAGE: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          package = os.environ["PACKAGE"]
          version = os.environ["VERSION"]
          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          url = f"https://pypi.org/pypi/{package}/{version}/json"

          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              with output.open("a", encoding="utf-8") as stream:
                  stream.write("already_published=false\n")
              print(f"PyPI {package} {version} does not exist yet; upload required.")
              raise SystemExit(0)

          remote = {}
          for item in payload.get("urls", []):
              if item.get("packagetype") not in {"bdist_wheel", "sdist"}:
                  continue
              filename = item["filename"]
              if filename in remote:
                  raise SystemExit(f"duplicate PyPI artifact filename: {filename}")
              remote[filename] = (item["size"], item["digests"]["sha256"])

          local = {}
          for path in pathlib.Path("dist").iterdir():
              if not (path.name.endswith(".whl") or path.name.endswith(".tar.gz")):
                  continue
              local[path.name] = (path.stat().st_size, hashlib.sha256(path.read_bytes()).hexdigest())

          if not local or set(local) != set(remote):
              raise SystemExit(
                  "existing PyPI release does not contain the exact local wheel + sdist: "
                  f"local={sorted(local)}, remote={sorted(remote)}"
              )
          for filename in sorted(local):
              if local[filename] != remote[filename]:
                  raise SystemExit(
                      f"existing PyPI artifact differs from the verified build: {filename}; "
                      f"local={local[filename]}, remote={remote[filename]}"
                  )
              print(f"RECOVERY MATCH {filename} size={local[filename][0]} sha256={local[filename][1]}")

          with output.open("a", encoding="utf-8") as stream:
              stream.write("already_published=true\n")
          print("Exact release already exists on PyPI; upload will be skipped.")
          PY

      - name: Publish to PyPI (trusted publishing)
        id: trusted_publish
        if: steps.pypi_state.outputs.already_published != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        continue-on-error: true

      - name: Publish to PyPI (API token fallback)
        id: token_publish
        if: >-
          steps.pypi_state.outputs.already_published != 'true' &&
          steps.trusted_publish.outcome != 'success' &&
          steps.auth.outputs.has_token == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true

      - name: Verify PyPI publication metadata
        shell: bash
        env:
          PACKAGE: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          package = os.environ["PACKAGE"]
          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/{package}/{version}/json"
          # PyPI's JSON cache lagged more than 60 s behind a successful upload in
          # the sister repository (scientific-computing-system 2.2.20), so the old
          # six-attempt budget could turn a completed publish into a red job.
          attempts = 30
          last_error = None
          for attempt in range(1, attempts + 1):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      payload = json.load(response)
                  if payload["info"]["version"] != version:
                      raise RuntimeError(f"version mismatch: {payload['info']['version']}")
                  package_types = {artifact["packagetype"] for artifact in payload["urls"]}
                  if not {"bdist_wheel", "sdist"} <= package_types:
                      raise RuntimeError(f"incomplete artifact set: {sorted(package_types)}")
                  break
              except (urllib.error.HTTPError, urllib.error.URLError, RuntimeError) as exc:
                  last_error = exc
                  print(f"PyPI metadata not visible yet (attempt {attempt}/{attempts})")
                  if attempt < attempts:
                      time.sleep(10)
          else:
              raise SystemExit(f"release metadata was not verified on PyPI: {last_error}")

          print(f"Verified PyPI publication metadata: {package} {version} ({sorted(package_types)})")
          PY
          echo "Trusted publishing outcome: ${{ steps.trusted_publish.outcome }}"
          echo "Token fallback outcome: ${{ steps.token_publish.outcome }}"

  # Run the compiled wheel built earlier in this workflow on all supported
  # operating systems. Installing the released distribution back from PyPI
  # would count as package downloads and inflate public statistics, so this
  # smoke test uses the artifact that was just published instead. The GitHub
  # Release is not created until these tests pass.
  verify_published:
    needs: publish
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Download the wheel built for this runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wheel-${{ matrix.os }}-312
          path: dist

      - name: Install release artifact without registry downloads
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="${{ needs.publish.outputs.package_name }}"
          VERSION="${{ needs.publish.outputs.version }}"
          python -m pip install --upgrade pip

          # Linux artifacts carry both the manylinux and musllinux wheel for the
          # same interpreter, so a single architecture match is ambiguous. Let
          # pip pick the wheel this runner can actually install.
          python -m pip install --no-cache-dir --no-index --find-links dist "${PACKAGE}==${VERSION}"

          VERSION="$VERSION" PACKAGE="$PACKAGE" python - <<'PY'
          import importlib.metadata as metadata
          import os
          import cds2

          expected = os.environ["VERSION"]
          package = os.environ["PACKAGE"]
          assert cds2.__version__ == expected, (cds2.__version__, expected)
          assert metadata.version(package) == expected, (metadata.version(package), expected)
          print(f"Verified installed release artifact: {package} {expected}")
          PY

      - name: Smoke-test release CLI and guided fit
        shell: bash
        run: |
          set -euo pipefail
          cds2 info
          python - <<'PY'
          import csv
          with open("release-cli-smoke.csv", "w", newline="", encoding="utf-8") as handle:
              writer = csv.writer(handle)
              writer.writerow(["x", "y", "sigma"])
              for x in range(1, 21):
                  writer.writerow([x, 2.0 * x + 1.0, 0.2])
          PY
          cds2 guided-fit release-cli-smoke.csv --x x --y y --sigma sigma --model linear --missing interpolate --outliers keep --report none --output-dir release-cli-smoke-output
          test -f release-cli-smoke-output/guided_fit_manifest.json
          test -f release-cli-smoke-output/release-cli-smoke_fit.png
          test -f release-cli-smoke-output/release-cli-smoke_fit.pdf
          test -f release-cli-smoke-output/release-cli-smoke_residuals.png
          test -f release-cli-smoke-output/release-cli-smoke_residuals.pdf
          cds2 guided-fit-rerun release-cli-smoke-output/guided_fit_manifest.json

  github_release:
    needs: [publish, verify_published]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download the verified distributions
        # The release previously had no assets at all: only a tag and generated
        # notes. These are the exact artifacts built and published above, so the
        # GitHub Release carries the same bytes as PyPI instead of a second,
        # independently built set.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve the release commit
        id: target
        shell: bash
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --force origin main
          target=""
          # The release commit is the first first-parent commit on main whose
          # _version.py declares this version. Later commits keep the value
          # until the next bump, so the first match is the one that landed it.
          while read -r commit; do
            [ -n "$commit" ] || continue
            declared="$(git show "${commit}:src/cds2/_version.py" \
              | sed -n 's/^__version__ = "\([^"]*\)"$/\1/p')"
            if [ "$declared" = "$VERSION" ]; then
              target="$commit"
              break
            fi
          done < <(git log --first-parent --reverse --format=%H origin/main -- src/cds2/_version.py)
          if [ -z "$target" ]; then
            echo "ERROR: could not find the commit on main that introduced ${VERSION}"
            exit 1
          fi
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "Release ${VERSION} corresponds to $target"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.publish.outputs.version }}
          target_commitish: ${{ steps.target.outputs.sha }}
          generate_release_notes: true
          files: |
            release-assets/*.whl
            release-assets/*.tar.gz

      - name: Verify GitHub release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}" origin main
          TAG_COMMIT="$(git rev-list -n 1 "v${VERSION}")"

          if [ "$TAG_COMMIT" != "$TARGET_SHA" ]; then
            echo "ERROR: v${VERSION} resolves to $TAG_COMMIT, expected release commit $TARGET_SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "ERROR: v${VERSION} resolves to $TAG_COMMIT, which is not on main"
            exit 1
          fi
          DECLARED="$(git show "${TAG_COMMIT}:src/cds2/_version.py" \
            | sed -n 's/^__version__ = "\([^"]*\)"$/\1/p')"
          if [ "$DECLARED" != "$VERSION" ]; then
            echo "ERROR: v${VERSION} points at $TAG_COMMIT, which declares '${DECLARED}'"
            exit 1
          fi

          gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null
          echo "Verified GitHub Release v${VERSION} at commit $TAG_COMMIT"
