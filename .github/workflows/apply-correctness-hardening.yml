name: Apply correctness hardening

on:
  push:
    branches:
      - hardening/full-correctness-audit

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/full-correctness-audit
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply final correctness patch
        run: python tools/apply_final_correctness.py
      - name: Remove generated artifacts
        run: |
          rm -rf guided-fit-results
          rm -f src/cds2/*.so src/cds2/*.pyd
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,test]'
      - name: Normalize formatting and imports
        run: |
          ruff check . --fix
          ruff format .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Final edge-case tests
        run: >-
          pytest -q
          tests/test_correctness_hardening_wave2.py
          tests/test_guided_fit.py
          tests/test_stats.py
          tests/test_mcmc.py
          tests/test_epidemiology.py
      - name: Full test suite
        run: pytest -q
      - name: Clean transient files before commit
        run: |
          rm -rf guided-fit-results
          rm -f src/cds2/*.so src/cds2/*.pyd
          rm -f tools/apply_final_correctness.py
      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Close remaining scientific correctness edge cases'
          git push origin HEAD:hardening/full-correctness-audit
