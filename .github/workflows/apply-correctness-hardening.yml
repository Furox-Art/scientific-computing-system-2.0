name: Apply correctness hardening

on:
  push:
    branches:
      - hardening/full-correctness-audit

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/full-correctness-audit
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply correctness hardening wave 2
        run: python tools/apply_correctness_hardening_2.py
      - name: Remove stale extension artifacts
        run: rm -f src/cds2/*.so src/cds2/*.pyd
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,test]'
      - name: Format
        run: ruff format .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Targeted correctness tests
        run: >-
          pytest -q
          tests/test_correctness_hardening_wave2.py
          tests/test_guided_fit.py
          tests/test_guided_cli.py
          tests/test_reliability.py
          tests/test_montecarlo.py
          tests/test_mcmc.py
          tests/test_stats.py
          tests/test_epidemiology.py
          tests/test_correctness_hardening.py
      - name: Full test suite
        run: pytest -q
      - name: Remove generated extension artifacts before commit
        run: rm -f src/cds2/*.so src/cds2/*.pyd
      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Fix reproducibility and scientific edge cases'
          git push origin HEAD:hardening/full-correctness-audit
