name: Format PDF report pagination

on:
  push:
    branches:
      - feature/pdf-report-pagination
    paths:
      - .github/workflows/format-pdf-report-pagination.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/pdf-report-pagination
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Tighten pagination test and format changed Python
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/tighten.py
          python /tmp/tighten.py
          python -m pip install ruff
          ruff format src/cds2/guided_fit.py tests/test_guided_fit.py
          ruff check --fix src/cds2/guided_fit.py tests/test_guided_fit.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cds2/guided_fit.py tests/test_guided_fit.py
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'Format PDF pagination implementation'
          git push origin HEAD:feature/pdf-report-pagination
