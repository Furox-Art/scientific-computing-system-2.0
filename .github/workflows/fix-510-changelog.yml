name: Repair 5.1.0 changelog

on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-510-changelog.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepend 5.1.0 release notes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG.md")
          old = path.read_text(encoding="utf-8")
          entry = '''## [v5.1.0] - 2026-09-05

Guided scientific fitting release: user-controlled model recommendation,
validated fitting workflows, reproducibility records, reporting and a fully
tested command-line interface join the library.

### Added

- **`cds2.guided_fit`** - recommends one candidate model while leaving the
  final model choice to the user; supports multiple datasets, measurement
  uncertainty, explicit missing-data policies and user-approved outlier
  handling.
- Repeated cross-validation, independent numerical cross-checks, parameter
  uncertainty, 95% confidence intervals and reliability labels.
- Matplotlib PNG/PDF fit diagnostics, reproducibility manifests and
  PDF/HTML/Markdown reports.
- **CLI** - `cds2 guided-fit` and `cds2 guided-fit-rerun`, with interactive
  and non-interactive operation.
- Release/package CI smoke-tests the installed wheel through fit ->
  artifacts/manifest -> rerun.

### Changed

- `cds2.optimize.curve_fit` exposes fit diagnostics and forwards weighting,
  bounds, solver method and Jacobian controls to SciPy.
- Supported package version advances from 5.0.0 to 5.1.0.

'''
          if not old.startswith("## [v5.1.0]"):
              path.write_text(entry + old, encoding="utf-8")
          PY
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-510-changelog.yml
          git add CHANGELOG.md
          git commit -m "Document release 5.1.0"
          git push origin HEAD:main
