name: Repair 5.1.0 changelog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Prepend 5.1.0 release notes
        run: |
          python -c 'from pathlib import Path; p=Path("CHANGELOG.md"); old=p.read_text(encoding="utf-8"); entry="## [v5.1.0] - 2026-09-05\n\nGuided scientific fitting release: user-controlled model recommendation, validated fitting workflows, reproducibility records, reporting and a fully tested command-line interface join the library.\n\n### Added\n\n- **`cds2.guided_fit`** - recommends one candidate model while leaving final model choice to the user; supports multiple datasets, measurement uncertainty, explicit missing-data policies and user-approved outlier handling.\n- Repeated cross-validation, independent numerical cross-checks, parameter uncertainty, 95% confidence intervals and reliability labels.\n- Matplotlib PNG/PDF fit diagnostics, reproducibility manifests and PDF/HTML/Markdown reports.\n- **CLI** - `cds2 guided-fit` and `cds2 guided-fit-rerun`, with interactive and non-interactive operation.\n- Release/package CI smoke-tests the installed wheel through fit -> artifacts/manifest -> rerun.\n\n### Changed\n\n- `cds2.optimize.curve_fit` exposes fit diagnostics and forwards weighting, bounds, solver method and Jacobian controls to SciPy.\n- Supported package version advances from 5.0.0 to 5.1.0.\n\n"; p.write_text(old if old.startswith("## [v5.1.0]") else entry+old, encoding="utf-8")'
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-510-changelog.yml
          git add CHANGELOG.md
          git commit -m "Document release 5.1.0"
          git push origin HEAD:main
