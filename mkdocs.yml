site_name: CDS v2
site_description: Scientific computing platform on the NumPy/SciPy/pandas/matplotlib stack.
site_author: Furox88
site_url: https://furox-art.github.io/scientific-computing-system-2.0/
repo_url: https://github.com/Furox-Art/scientific-computing-system-2.0
repo_name: Furox-Art/scientific-computing-system-2.0

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Modules overview: modules.md
  - Examples: examples.md
  - Industrial computing: industrial.md
  - Benchmarks: benchmarks.md
  - Release process: release.md
  - API Reference:
      - cds2.linalg: api/linalg.md
      - cds2.stats: api/stats.md
      - cds2.optimize: api/optimize.md
      - cds2.integrate: api/integrate.md
      - cds2.interpolate: api/interpolate.md
      - cds2.signals: api/signals.md
      - cds2.montecarlo: api/montecarlo.md
      - cds2.graph: api/graph.md
      - cds2.ml: api/ml.md
      - cds2.timeseries: api/timeseries.md
      - cds2.viz: api/viz.md
      - cds2.io: api/io.md
      - cds2.sparse: api/sparse.md
      - cds2.spectral: api/spectral.md
      - cds2.modeling: api/modeling.md
      - cds2.quantum: api/quantum.md
      - cds2.knowledge: api/knowledge.md
      - cds2.scientific: api/scientific.md
      - cds2.hypothesis: api/hypothesis.md
      - cds2.nlp: api/nlp.md
      - cds2.infotheory: api/infotheory.md
      - cds2.chaos: api/chaos.md
      - cds2.bayes: api/bayes.md
      - cds2.metaheuristics: api/metaheuristics.md
      - cds2.geometry: api/geometry.md
      - cds2.rl: api/rl.md
      - cds2.calculus: api/calculus.md
      - cds2.special: api/special.md
      - cds2.cli: api/cli.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables
