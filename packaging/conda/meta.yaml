{% set name = "scientific-computing-system-2.0" %}
{% set version = "5.4.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/s/scientific-computing-system-2.0/scientific_computing_system_2_0-{{ version }}.tar.gz
  # sha256 of the PyPI sdist for this exact version (verified against the
  # published scientific_computing_system_2_0-5.4.3.tar.gz digest). It MUST be
  # refreshed deliberately on every release: bump `version` above to the new tag
  # and set this to the `sha256` pip/PyPI publishes for that sdist. conda-build
  # fails closed if the digest does not match the downloaded artifact, so a stale
  # value is a release-train blocker rather than a silent drift.
  sha256: 5b38ea0fef12549827c17c00423dca8d8374595fed6917f2b702471624aa4407

build:
  noarch: python
  number: 0
  script_env:
    - CDS_PURE=1
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=3.10
    - numpy >=1.26
    - scipy >=1.11
    - pandas >=2.2
    - matplotlib-base >=3.8

test:
  imports:
    - cds2
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Furox-Art/scientific-computing-system-2.0
  license: MIT
  license_file: LICENSE
  summary: NumPy build of scientific-computing-system. Not a separate product.
  description: |
    Accelerated build of scientific-computing-system on NumPy, SciPy, pandas,
    and matplotlib. The pure-Python package remains scientific-computing-system.
    This recipe sets CDS_PURE=1 so the optional C extensions are not compiled;
    the published wheels on PyPI may still contain them.
  doc_url: https://furox-art.github.io/scientific-computing-system-2.0/
  dev_url: https://github.com/Furox-Art/scientific-computing-system-2.0

extra:
  recipe-maintainers:
    - Furox-Art
