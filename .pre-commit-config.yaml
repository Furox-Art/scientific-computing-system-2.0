repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # packaging/conda/meta.yaml is a Jinja template ({% set version = ... %}),
        # which is not valid YAML until conda-build renders it. It only reaches
        # this hook when the file changes, which is exactly when a real syntax
        # error could hide behind the template failure.
        exclude: ^packaging/conda/meta\.yaml$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Keep this rev current with the ruff that CI installs. tests.yml installs
  # the pinned version from constraints/ci-tools.txt, so a stale pin here means
  # the hook enforces a different rule set than the gate. At v0.5.5 it applied
  # UP038 (since retired) and rewrote 69 files that CI was perfectly happy
  # with, which is worse than having no hook at all.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        # --exit-non-zero-on-fix so an auto-fix is never silently committed.
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
